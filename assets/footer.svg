<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0c1a2b"/>
    </linearGradient>
    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; font-size: 20px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="89" rx="14" fill="url(#bg)" stroke="#1e293b"/>
  <text x="40" y="53" class="m"><tspan fill="#28c840">usman@devops</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#e2e8f0">$ echo "Thanks for visiting — let's build something reliable."</tspan></text>
  <rect x="964" y="36" width="11" height="22" fill="#e2e8f0" class="cursor"/>
</svg>
