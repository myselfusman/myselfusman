<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Usman Siddique. DevOps Engineer: Linux, AWS, Docker, CI/CD, Jenkins, GitHub Actions and Nginx. Open to onsite and remote roles.">
