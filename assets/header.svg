<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Usman Siddique — DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0c1a2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="440" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
      .l { }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.1s }
      .d4 { animation-delay: 1.6s } .d5 { animation-delay: 2.0s } .d6 { animation-delay: 2.5s }
      .d7 { animation-delay: 2.9s } .d8 { animation-delay: 3.3s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 74px 343px; }
      @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
      .chip rect { fill: #0f2236; stroke: #1f3b57; }
      .chip text { fill: #9fdcf0; font-size: 15px; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="1050" cy="90" r="160" fill="#22d3ee" opacity="0.16" filter="url(#blur)"/>
    <circle cx="900" cy="420" r="170" fill="#8b5cf6" opacity="0.18" filter="url(#blur)"/>

    <!-- window chrome -->
    <rect width="1200" height="44" fill="#0b1220"/>
    <rect y="44" width="1200" height="1" fill="#1e293b"/>
    <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="22" r="7" fill="#febc2e"/>
    <circle cx="76" cy="22" r="7" fill="#28c840"/>
    <text x="600" y="27" text-anchor="middle" class="mono" font-size="14" fill="#64748b">usman@devops: ~ — bash</text>

    <!-- terminal content -->
    <g class="mono" font-size="20">
      <text x="60" y="98" class="l d1"><tspan fill="#28c840">usman@devops</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#e2e8f0">$ whoami</tspan></text>
    </g>

    <text x="56" y="172" class="sans l d2" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">Usman Siddique</text>
    <text x="60" y="214" class="sans l d3" font-size="24" fill="#cbd5e1">DevOps Engineer  ·  Containers, Linux servers &amp; deployment automation</text>

    <g class="mono" font-size="20">
      <text x="60" y="276" class="l d4"><tspan fill="#28c840">usman@devops</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#e2e8f0">$ docker ps --format "{{.Names}}"</tspan></text>
    </g>

    <g class="mono l d5">
      <g class="chip"><rect x="60" y="292" width="92" height="30" rx="6"/><text x="106" y="313" text-anchor="middle">docker</text></g>
      <g class="chip"><rect x="162" y="292" width="82" height="30" rx="6"/><text x="203" y="313" text-anchor="middle">nginx</text></g>
      <g class="chip"><rect x="254" y="292" width="92" height="30" rx="6"/><text x="300" y="313" text-anchor="middle">traefik</text></g>
      <g class="chip"><rect x="356" y="292" width="112" height="30" rx="6"/><text x="412" y="313" text-anchor="middle">portainer</text></g>
      <g class="chip"><rect x="478" y="292" width="160" height="30" rx="6"/><text x="558" y="313" text-anchor="middle">github-actions</text></g>
      <g class="chip"><rect x="648" y="292" width="82" height="30" rx="6"/><text x="689" y="313" text-anchor="middle">linux</text></g>
      <g class="chip"><rect x="740" y="292" width="72" height="30" rx="6"/><text x="776" y="313" text-anchor="middle">aws</text></g>
      <g class="chip"><rect x="822" y="292" width="122" height="30" rx="6"/><text x="883" y="313" text-anchor="middle">cloudflare</text></g>
    </g>

    <g class="l d6">
      <circle cx="74" cy="356" r="7" fill="#28c840" class="pulse"/>
      <text x="92" y="362" class="mono" font-size="19" fill="#86efac">STATUS: available for hire</text>
      <text x="400" y="362" class="mono" font-size="19" fill="#64748b">│  Rahim Yar Khan, Pakistan  │  5 yrs in production</text>
    </g>

    <g class="mono" font-size="20">
      <text x="60" y="408" class="l d7"><tspan fill="#28c840">usman@devops</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#e2e8f0">$ </tspan></text>
      <g class="l d8"><rect x="254" y="390" width="11" height="22" fill="#e2e8f0" class="cursor"/></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#1e293b"/>
</svg>
