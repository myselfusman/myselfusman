<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="5+ years in production, 100+ websites shipped, 4 countries served, 10 certifications">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a2a"/>
      <stop offset="1" stop-color="#0a111d"/>
    </linearGradient>
    <style>
      .num { font-family: 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif; font-weight: 800; font-size: 58px; }
      .lbl { font-family: 'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace; font-size: 17px; fill: #94a3b8; letter-spacing: 1px; }
      .c { }
      .c1 { animation-delay: .1s } .c2 { animation-delay: .3s } .c3 { animation-delay: .5s } .c4 { animation-delay: .7s }
      @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <g class="c c1">
    <rect x="1" y="1" width="282" height="166" rx="14" fill="url(#card)" stroke="#1e293b"/>
    <rect x="1" y="1" width="282" height="4" rx="2" fill="#22d3ee"/>
    <text x="142" y="92" text-anchor="middle" class="num" fill="url(#n)">5+</text>
    <text x="142" y="132" text-anchor="middle" class="lbl">YEARS IN PRODUCTION</text>
  </g>
  <g class="c c2">
    <rect x="306" y="1" width="282" height="166" rx="14" fill="url(#card)" stroke="#1e293b"/>
    <rect x="306" y="1" width="282" height="4" rx="2" fill="#60a5fa"/>
    <text x="447" y="92" text-anchor="middle" class="num" fill="url(#n)">100+</text>
    <text x="447" y="132" text-anchor="middle" class="lbl">WEBSITES SHIPPED</text>
  </g>
  <g class="c c3">
    <rect x="611" y="1" width="282" height="166" rx="14" fill="url(#card)" stroke="#1e293b"/>
    <rect x="611" y="1" width="282" height="4" rx="2" fill="#818cf8"/>
    <text x="752" y="92" text-anchor="middle" class="num" fill="url(#n)">4</text>
    <text x="752" y="132" text-anchor="middle" class="lbl">COUNTRIES SERVED</text>
  </g>
  <g class="c c4">
    <rect x="916" y="1" width="282" height="166" rx="14" fill="url(#card)" stroke="#1e293b"/>
    <rect x="916" y="1" width="282" height="4" rx="2" fill="#c084fc"/>
    <text x="1057" y="92" text-anchor="middle" class="num" fill="url(#n)">10</text>
    <text x="1057" y="132" text-anchor="middle" class="lbl">CERTIFICATIONS</text>
  </g>
</svg>
